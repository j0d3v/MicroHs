name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

jobs:
  build-linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: jirutka/setup-alpine@v1
        with:
          arch: x86_64
          branch: v3.20
          packages: build-base musl-dev file

      - uses: actions/checkout@v5

      - uses: actions/cache@v5
        id: cache
        with:
          path: bin/mhs
          key: release-linux-x86_64-static-${{ hashFiles('generated/mhs.c', 'src/runtime/**') }}

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: make bin/mhs CCOPTS="-O3 -static"
        shell: alpine.sh {0}

      - name: Verify static
        run: file bin/mhs | grep -q 'statically linked'
        shell: alpine.sh {0}

      - name: Stage and package
        run: |
          V=$(grep '^VERSION=' Makefile | cut -d= -f2 | tr -d ' ')
          DATA="staging/mhs-$V/packages/mhs-$V/data"
          mkdir -p staging/bin "$DATA/src"
          sed -e 's,%GMPFLAGS,,' -e 's,%GMPLIBS,-lm,' mhs.conf.in > mhs.conf
          strip --strip-all bin/mhs && cp bin/mhs staging/bin/mhs
          cp mhs.conf "$DATA/mhs.conf"
          cp -r src/runtime "$DATA/src/runtime"
          bin/mhs -Q generated/base.pkg "staging/mhs-$V"
          tar czf mhs-linux-x86_64.tar.gz -C staging .
        shell: alpine.sh {0}

      - uses: actions/upload-artifact@v6
        with:
          name: mhs-linux-x86_64
          path: mhs-linux-x86_64.tar.gz

  build-linux-x86_64-gmp:
    name: Linux x86_64 (GMP)
    runs-on: ubuntu-latest
    env:
      MHSGMPCCFLAGS: -DWANT_GMP=1
      MCABALGMP: -fgmp
      MHSGMP: -ilib/gmp
      MHSGMPCCLIBS: -lgmp
    steps:
      - uses: jirutka/setup-alpine@v1
        with:
          arch: x86_64
          branch: v3.20
          packages: build-base musl-dev gmp-dev file

      - uses: actions/checkout@v5

      - uses: actions/cache@v5
        id: cache
        with:
          path: bin/mhs
          key: release-linux-x86_64-gmp-static-${{ hashFiles('generated/mhs.c', 'src/runtime/**') }}

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: make bin/mhs CCOPTS="-O3 -static"
        shell: alpine.sh {0}

      - name: Verify static
        run: file bin/mhs | grep -q 'statically linked'
        shell: alpine.sh {0}

      - name: Stage and package
        run: |
          V=$(grep '^VERSION=' Makefile | cut -d= -f2 | tr -d ' ')
          DATA="staging/mhs-$V/packages/mhs-$V/data"
          mkdir -p staging/bin "$DATA/src"
          sed -e "s,%GMPFLAGS,$MHSGMPCCFLAGS," -e "s,%GMPLIBS,$MHSGMPCCLIBS," mhs.conf.in > mhs.conf
          strip --strip-all bin/mhs && cp bin/mhs staging/bin/mhs
          cp mhs.conf "$DATA/mhs.conf"
          cp -r src/runtime "$DATA/src/runtime"
          bin/mhs -Q generated/base.pkg "staging/mhs-$V"
          tar czf mhs-linux-x86_64-gmp.tar.gz -C staging .
        shell: alpine.sh {0}

      - uses: actions/upload-artifact@v6
        with:
          name: mhs-linux-x86_64-gmp
          path: mhs-linux-x86_64-gmp.tar.gz

  release:
    name: Create Release
    needs: [build-linux-x86_64, build-linux-x86_64-gmp]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Resolve tag
        id: tag
        run: |
          V=$(grep '^VERSION=' Makefile | cut -d= -f2 | tr -d ' ')
          echo "value=v${V}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: MicroHs ${{ steps.tag.outputs.value }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/mhs-linux-x86_64/mhs-linux-x86_64.tar.gz
            artifacts/mhs-linux-x86_64-gmp/mhs-linux-x86_64-gmp.tar.gz
